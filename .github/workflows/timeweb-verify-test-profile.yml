name: Timeweb verify second Telegram test profile
on:
  workflow_dispatch:
  push:
    branches:
      - fix/yoomoney-payments-reliability-2026
    paths:
      - scripts/timeweb_verify_test_profile.py
      - .github/workflows/timeweb-verify-test-profile.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet 'paramiko>=3.4,<5'
      - name: Verify test deep link used by one account
        env:
          TIMEWEB_SSH_PASSWORD: ${{ secrets.TIMEWEB_SSH_PASSWORD }}
        run: python scripts/timeweb_verify_test_profile.py
