name: Timeweb stats discrepancy diagnostics
on:
  workflow_dispatch:
  push:
    branches:
      - fix/yoomoney-payments-reliability-2026
    paths:
      - scripts/timeweb_stats_diagnostic.py
      - .github/workflows/timeweb-stats-diagnostic.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet 'paramiko>=3.4,<5'
      - name: Read-only process, SQLite, and polling conflict checks
        env:
          TIMEWEB_SSH_PASSWORD: ${{ secrets.TIMEWEB_SSH_PASSWORD }}
        run: python scripts/timeweb_stats_diagnostic.py
