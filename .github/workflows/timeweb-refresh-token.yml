name: Timeweb refresh bot token (payments disabled)

on:
  workflow_dispatch:
  push:
    branches:
      - fix/yoomoney-payments-reliability-2026
    paths:
      - scripts/timeweb_refresh_token.py
      - .github/workflows/timeweb-refresh-token.yml

permissions:
  contents: read

concurrency:
  group: timeweb-refresh-token
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet 'paramiko>=3.4,<5'
      - name: Install repository token and verify service
        env:
          TIMEWEB_SSH_PASSWORD: ${{ secrets.TIMEWEB_SSH_PASSWORD }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python scripts/timeweb_refresh_token.py
