name: Timeweb HTTPS read-only preflight

on:
  workflow_dispatch:
  push:
    branches:
      - fix/yoomoney-payments-reliability-2026
    paths:
      - scripts/timeweb_https_preflight.py
      - .github/workflows/timeweb-https-preflight.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet 'paramiko>=3.4,<5'
      - name: Check DNS, server health and HTTPS prerequisites
        env:
          TIMEWEB_SSH_PASSWORD: ${{ secrets.TIMEWEB_SSH_PASSWORD }}
        run: python scripts/timeweb_https_preflight.py
