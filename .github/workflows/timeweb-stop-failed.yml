name: Timeweb stop failed bot restart loop

on:
  workflow_dispatch:
  push:
    branches:
      - fix/yoomoney-payments-reliability-2026
    paths:
      - scripts/timeweb_stop_failed.py
      - .github/workflows/timeweb-stop-failed.yml

permissions:
  contents: read

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet 'paramiko>=3.4,<5'
      - name: Stop bot until Telegram token is corrected
        env:
          TIMEWEB_SSH_PASSWORD: ${{ secrets.TIMEWEB_SSH_PASSWORD }}
        run: python scripts/timeweb_stop_failed.py
