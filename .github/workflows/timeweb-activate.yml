name: Timeweb activate bot (payments disabled)

on:
  workflow_dispatch:
  push:
    branches:
      - fix/yoomoney-payments-reliability-2026
    paths:
      - scripts/timeweb_activate.py
      - .github/workflows/timeweb-activate.yml

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet 'paramiko>=3.4,<5'
      - name: Activate bot with disabled checkout
        env:
          TIMEWEB_SSH_PASSWORD: ${{ secrets.TIMEWEB_SSH_PASSWORD }}
        run: python scripts/timeweb_activate.py
