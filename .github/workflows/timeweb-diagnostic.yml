name: Timeweb read-only diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - fix/yoomoney-payments-reliability-2026
    paths:
      - .github/workflows/timeweb-diagnostic.yml
      - scripts/timeweb_diagnostic.py
      - scripts/timeweb_ssh_diagnostic.py

permissions:
  contents: read

jobs:
  timeweb:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check Timeweb server without changing it
        env:
          TIMEWEB_API_TOKEN: ${{ secrets.TIMEWEB_API_TOKEN }}
          TIMEWEB_SERVER_NAME: Honest Plover
        run: python scripts/timeweb_diagnostic.py

      - name: Install SSH client dependency
        run: python -m pip install --quiet 'paramiko>=3.4,<5'
      - name: Probe bot service via SSH (read-only)
        env:
          TIMEWEB_API_TOKEN: ${{ secrets.TIMEWEB_API_TOKEN }}
          TIMEWEB_SSH_HOSTKEY_SHA256: ${{ secrets.TIMEWEB_SSH_HOSTKEY_SHA256 }}
        run: python scripts/timeweb_ssh_diagnostic.py
